name: NetLog AI CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  lint-and-test:
    name: Lint, Format & Test (Coverage >= 80%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ruff linter
        run: ruff check app scripts tests

      - name: Verify black formatting
        run: black --check app scripts tests

      - name: Run pytest with coverage
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite:///:memory:"
          API_KEY: ci-test-api-key
          LLM_PROVIDER: mock
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Run synthetic evaluation smoke check
        run: |
          python scripts/generate_logs.py --output-dir data --duration-minutes 60 --seed 42
          python scripts/evaluate.py --log-file data/synthetic_server.log --ground-truth data/ground_truth.json --results-file /tmp/eval_results.md --runs 2

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: netlog-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
